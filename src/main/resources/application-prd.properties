# Profile de producao.
# Todas as variaveis de ambiente sao obrigatorias (sem valores padrao),
# evitando conexoes acidentais com credenciais de desenvolvimento.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT:false};trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

# ddl-auto=none: em producao as tabelas sao criadas pelo script de
# migration (migration-2026-08-17.sql), nunca pelo Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
