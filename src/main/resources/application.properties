spring.application.name=jogador
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Profile usado quando SPRING_PROFILES_ACTIVE nao for informado
spring.profiles.default=dev

# Database - SQL Server
# Todos os dados de conexao vem de variaveis de ambiente. Os valores apos
# ":" sao o fallback usado em desenvolvimento (SQL Server local na porta
# 1433). Quando a API roda em container e o SQL Server esta no host, use
# DB_SERVER_URL=host.docker.internal.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:1433};databaseName=${DB_NAME:api};encrypt=${DB_ENCRYPT:false};trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD:1q2w3e4R@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
